[project]
name = "full-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nemo_toolkit[asr]>=2.0.0",
    "ctranslate2>=4.0.0",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "piper-tts>=1.2.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "huggingface_hub>=0.23.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
